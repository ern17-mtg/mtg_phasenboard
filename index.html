<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Magic Phasenboard</title>
<style>
:root{--panel:#1d1d1d;--red:#e0121c;--red2:#7a0a10}
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f2f2f2;font-family:Impact,"Arial Black",sans-serif;display:flex;justify-content:center;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.board{width:100%;max-width:520px;margin:10px;padding:14px;background:linear-gradient(145deg,#222,#111);border-radius:22px;box-shadow:0 10px 30px #000,inset 0 2px 3px #444}
h1{margin:0 0 8px;font-size:42px;color:var(--red);text-align:center;letter-spacing:2px;text-shadow:2px 2px 0 var(--red2),3px 3px 0 #000,4px 4px 6px #000}
.red{color:var(--red);text-shadow:1px 1px 0 var(--red2),2px 2px 3px #000}
.bar,.land,.combat{margin:8px 0;padding:10px;background:var(--panel);border-radius:12px;box-shadow:inset 0 2px 6px #000}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lbl{display:block;font:11px Arial,sans-serif;color:#aaa;text-transform:uppercase;letter-spacing:1px}
.timer{font-size:24px;font-variant-numeric:tabular-nums}
.btn{font-family:inherit;font-size:16px;letter-spacing:1px;color:#fff;background:linear-gradient(#f2272f,#a00b13);border:0;border-radius:12px;padding:10px 16px;cursor:pointer;box-shadow:0 4px 0 #5a0509,0 6px 8px #000;text-transform:uppercase;margin:3px}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #5a0509}
.btn:disabled{background:#3a3a3a;color:#777;box-shadow:0 4px 0 #222;cursor:not-allowed}
.btn.big{width:100%;font-size:21px;padding:13px;margin:12px 0 0}
.btn.gray{background:linear-gradient(#666,#333);box-shadow:0 4px 0 #111,0 6px 8px #000}
input{width:100%;margin:6px 0;padding:12px;border-radius:10px;border:0;background:#050505;color:#fff;font:18px Arial,sans-serif;text-transform:none}
.ov{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ov div{background:var(--panel);border-radius:8px;padding:6px 2px;text-align:center;font:13px Arial,sans-serif;color:#aaa;box-shadow:inset 0 2px 4px #000;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov div.act{color:#fff;box-shadow:0 0 0 2px var(--red)}
.ov b{display:block;font:15px Impact,sans-serif;color:var(--red);font-variant-numeric:tabular-nums}
.info{display:flex;justify-content:space-between;font-size:19px;margin:10px 0}
.phase{display:flex;align-items:center;justify-content:space-between;margin:6px 0;padding:7px 10px;border-radius:10px}
.phase.active{background:#2a1214;box-shadow:0 0 0 2px var(--red),0 0 14px #e0121c88}
.phase.done{opacity:.55}
.name{font-size:25px;color:var(--red);text-shadow:1px 1px 0 var(--red2),2px 2px 3px #000}
.name small{display:block;font:12px Arial,sans-serif;color:#bbb;text-shadow:none}
.tg{position:relative;width:84px;height:34px;border-radius:17px;background:#050505;border:0;box-shadow:inset 0 3px 6px #000;cursor:pointer;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:4px;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff6a70,var(--red) 55%,var(--red2));box-shadow:0 3px 5px #000;transition:.2s}
.tg.on::after{left:52px}.tg:disabled{opacity:.35;cursor:not-allowed}
.land{text-align:center}.land.lock{background:#5a0509;border:2px solid #ff3b43}
.land b{display:block;font-size:18px;margin-bottom:6px}
.step{padding:4px 6px;font:15px Arial,sans-serif;color:#888}.step.cur{color:#fff;font-weight:bold}.step.ok{color:#5ec86a}
.alert{margin:8px 0;padding:10px;border-radius:10px;background:#ffd400;color:#000;font:bold 15px Arial,sans-serif;text-align:center;animation:bl .8s infinite}
@keyframes bl{50%{opacity:.3}}
.hint{padding:12px;text-align:center;font:15px Arial,sans-serif;color:#ccc;background:#222;border-radius:10px;margin:8px 0}
.dz{opacity:.35;filter:grayscale(1);pointer-events:none}
.center{text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="board">
  <h1>Magic v2</h1>
  <div id="lobby">
    <input id="name" placeholder="Dein Name" maxlength="14">
    <input id="code" placeholder="Raumcode (z. B. DRAGON)" maxlength="10" autocapitalize="characters">
    <button class="btn big" onclick="join(true)">Neuen Raum erstellen</button>
    <button class="btn big gray" onclick="join(false)">Raum beitreten</button>
    <div class="hint" id="msg" hidden></div>
  </div>
  <div id="game" hidden>
    <div class="bar">
      <div><small class="lbl">Gesamtdauer</small><span class="timer red" id="timer">00:00:00</span></div>
      <div class="center"><small class="lbl">Raum</small><span class="timer red" id="roomtag"></span></div>
      <button class="btn" id="pauseBtn" onclick="A('pause')">Pause</button>
    </div>
    <div class="ov" id="ov"></div>
    <div id="play"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* >>> HIER DEINE FIREBASE-WERTE EINTRAGEN <<< */
const CFG={
  apiKey:"AIzaSyDcyc4BE2zascyxldLY5IynKaZSKJJDoEE",
  authDomain:"mtg-test-a40fb.firebaseapp.com",
  databaseURL:"https://mtg-test-a40fb-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"mtg-test-a40fb",
  appId:"1:506239449378:web:f6db868edc44a24162cd7b"
};

const PH=[{n:"Untap",h:"Keine Spontanzauber erlaubt"},{n:"Upkeep",h:"Trigger-Check"},{n:"Draw",h:"Karte ziehen"},{n:"Main 1",h:"Landdrop möglich"},{n:"Combat",h:"Detaillierter Ablauf"},{n:"Main 2",h:"Landdrop möglich (falls nicht in Main 1)"},{n:"End Step",h:"End-Trigger-Check"}];
const CS=["Beginning of Combat","Declare Attackers","Declare Blockers","First Strike / Combat Damage","End of Combat"];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const fmt=t=>{const f=n=>String(n).padStart(2,"0");return f(Math.floor(t/3600))+":"+f(Math.floor(t/60)%60)+":"+f(t%60)};
let uid=localStorage.mtgUid||(localStorage.mtgUid=Math.random().toString(36).slice(2)),room="",ref,S=null,off=0;
firebase.initializeApp(CFG);
const db=firebase.database();
db.ref(".info/serverTimeOffset").on("value",x=>off=x.val()||0);
const now=()=>Date.now()+off;
const msg=t=>{$("msg").hidden=false;$("msg").textContent=t};

function join(create){
  const name=$("name").value.trim(),code=$("code").value.trim().toUpperCase();
  if(!name||code.length<3)return msg("Bitte Name und Raumcode (mind. 3 Zeichen) eingeben.");
  const r=db.ref("rooms/"+code),keep=()=>{};
  r.on("value",keep);
  r.once("value").then(()=>r.transaction(s=>{
    if(create){if(s)return;s={started:false,round:1,active:0,players:{},ptime:[0,0,0,0]}}
    else if(!s)return;
    s.players=s.players||{};
    if(!s.players[uid]){const n=Object.keys(s.players).length;if(n>=4)return;s.players[uid]={name:name,seat:n}}
    else s.players[uid].name=name;
    return s;
  },(err,ok)=>{
    r.off("value",keep);
    if(err||!ok)return msg((create?"Dieser Raumcode existiert schon.":"Beitritt nicht möglich: Raum nicht gefunden oder voll.")+" ["+(err?err.message:"abgebrochen, ok="+ok)+"]");
    room=code;ref=r;localStorage.mtgLast=JSON.stringify({name:name,code:code});
    $("lobby").hidden=true;$("game").hidden=false;$("roomtag").textContent=code;
    r.on("value",x=>{S=x.val();render()});
  }));
}
try{const l=JSON.parse(localStorage.mtgLast||"null");if(l){$("name").value=l.name;$("code").value=l.code}}catch(e){}

function T(fn){ref.transaction(s=>{if(!s)return s;fn(s);return s})}
const cur=s=>s&&s.started?Math.max(0,Math.floor(((s.pausedAt||now())-s.turnStart)/1000)):0;

// Ermittelt welcher Spieler gerade aktiv die Uhr laufen hat
function currentClockHolder(s) {
  if(!s || !s.started) return null;
  if(s.prio && s.prio.taker != null) return s.prio.taker;
  return s.active;
}

// Bucht die verstreichende Zeit ab und setzt die Zeituhr auf JETZT zurück
function commitTime(s) {
  const holder = currentClockHolder(s);
  if(holder != null) {
    s.ptime = s.ptime || [0,0,0,0];
    s.ptime[holder] = (s.ptime[holder] || 0) + cur(s);
  }
  s.turnStart = now();
}

function resetTurn(s){s.p=0;s.land=false;s.lock=false;s.cs=-1;s.check=false;s.prio=null}
function advance(s){if(s.p===5&&!s.land)s.lock=true;s.p++;if(s.p===4){s.cs=0;s.check=false}}

function getPrioOrder(s, NP){
  const o = ord(s, NP);
  const actIdx = o.indexOf(s.active);
  const order = [];
  for(let i = 1; i < NP; i++){
    order.push(o[(actIdx + i) % NP]);
  }
  return order;
}

function startPhasePrio(s, targetPhase, targetAction, NP) {
  s.prio = {
    ctx: "phase",
    targetPhase: targetPhase,
    targetAction: targetAction,
    queue: getPrioOrder(s, NP),
    currentIdx: 0
  };
}

function closePrio(s, NP){
  if(s.prio.ctx === "phase"){
    const tp = s.prio.targetPhase;
    const ta = s.prio.targetAction;
    s.prio = null;
    if(ta === "adv") advance(s);
    else if(ta === "end") {
      commitTime(s);
      const o = ord(s, NP), n = (o.indexOf(s.active) + 1) % NP;
      s.active = o[n];
      if(n === 0) s.round++;
      resetTurn(s);
      s.turnStart = now();
      s.pausedAt = null;
    }
  } else if(s.prio.ctx === "c"){
    s.check = false;
    s.cs++;
    if(s.cs > 4) s.cs = 5;
    s.prio = null;
  } else {
    s.prio = null;
  }
}

const ord=(s,NP)=>{const o=(s.order||[]).filter(i=>i<NP);for(let i=0;i<NP;i++)if(!o.includes(i))o.push(i);return o};

function A(a,x){T(s=>{
  const m=s.players[uid].seat,act=m===s.active,NP=Object.keys(s.players).length,det=s.round>=3;
  
  if(a==="start"&&!s.started&&NP>=2){
    const o=ord(s,NP);s.order=o;s.started=true;s.round=1;s.active=o[0];s.ptime=[0,0,0,0];resetTurn(s);s.turnStart=now();s.pausedAt=null;
  }
  else if((a==="up"||a==="down")&&!s.started){
    const o=ord(s,NP),j=a==="up"?x-1:x+1;if(j>=0&&j<NP){const t=o[x];o[x]=o[j];o[j]=t;s.order=o}
  }
  else if(a==="pause"&&s.started){
    if(s.pausedAt){s.turnStart+=now()-s.pausedAt;s.pausedAt=null}else s.pausedAt=now()
  }
  else if(a==="adv"&&act&&det&&!s.prio&&s.p<7&&!(s.p===4&&s.cs<5)){
    if(s.p === 1 || s.p === 3) {
      startPhasePrio(s, s.p + 1, "adv", NP);
    } else {
      advance(s);
    }
  }
  else if(a==="land"&&act&&det&&(s.p===3||s.p===5)&&!s.land&&!s.lock) {
    s.land=true;
  }
  else if(a==="skip_attackers"&&act&&det&&s.p===4&&s.cs===1&&!s.prio) {
    s.cs = 5;
  }
  else if(a==="cstep"&&act&&det&&s.p===4&&s.cs>=0&&s.cs<=4&&!s.prio){
    s.check=true;s.prio={ctx:"c",votes:{}}
  }
  else if(a==="give"&&act&&det&&!s.prio) {
    s.prio={ctx:"g",votes:{}}
  }
  else if(a==="vote"&&s.prio&&!act){
    if(s.prio.ctx === "phase") {
      const currentInPrio = s.prio.queue[s.prio.currentIdx];
      if(m === currentInPrio) {
        if(x === "pass") {
          s.prio.currentIdx++;
          if(s.prio.currentIdx >= s.prio.queue.length) {
            closePrio(s, NP);
          }
        } else if(x === "take") {
          commitTime(s); // Zeit des Spielers am Zug stopen
          s.prio.taker = m; // Zeit läuft ab sofort für den Taker
        }
      }
    } else if(s.prio.taker == null) {
      const v=s.prio.votes=s.prio.votes||{};v[m]=x;
      const o=[...Array(NP).keys()].filter(i=>i!==s.active);
      if(o.every(i=>v[i])){
        const t=o.find(i=>v[i]==="take");
        if(t!==undefined) {
          commitTime(s);
          s.prio.taker=t;
        } else closePrio(s, NP);
      }
    }
  }
  else if(a==="done"&&s.prio&&s.prio.taker===m){
    commitTime(s); // Genommene Zeit auf das Konto des Takers buchen
    delete s.prio.taker;

    if(s.prio.ctx === "phase") {
      // Priorität geht weiter an den nächsten Spieler in der Phase
      s.prio.currentIdx++;
      if(s.prio.currentIdx >= s.prio.queue.length) {
        closePrio(s, NP);
      }
    } else {
      // Manuelle Priorität aufgelöst
      s.prio.votes={};
    }
  }
  else if(a==="end"&&act&&!s.prio&&(!det||s.p>=7)){
    if(det) {
      startPhasePrio(s, 7, "end", NP);
    } else {
      commitTime(s);
      const o=ord(s,NP),n=(o.indexOf(s.active)+1)%NP;s.active=o[n];if(n===0)s.round++;
      resetTurn(s);s.turnStart=now();s.pausedAt=null;
    }
  }
})}

function render(){
  if(!S)return;
  const P=S.players,names=[];Object.values(P).forEach(p=>names[p.seat]=esc(p.name));
  const NP=names.length,me=P[uid].seat;
  $("pauseBtn").textContent=S.pausedAt?"Resume":"Pause";
  
  if(!S.started){
    const o=ord(S,NP);
    $("play").innerHTML=`<div class="hint">Im Raum <b>${esc(room)}</b>. Mitspieler können mit diesem Code beitreten (max. 4).<br>Lege die Zugreihenfolge fest:</div>`+o.map((seat,i)=>`<div class="bar"><span class="name">${i+1}. ${names[seat]}</span><span><button class="btn gray" ${i===0?"disabled":""} onclick="A('up',${i})">▲</button><button class="btn gray" ${i===NP-1?"disabled":""} onclick="A('down',${i})">▼</button></span></div>`).join("")+`<button class="btn big" onclick="A('start')" ${NP<2?"disabled":""}>Spiel starten</button>`;
    tick();return;
  }
  
  const act=me===S.active,det=S.round>=3,pr=S.prio,ctl=act&&!pr&&!S.pausedAt;
  let h=`<div class="info"><span>Runde <span class="red">${S.round}</span></span><span>Am Zug: <span class="red">${names[S.active]}</span>${act?" (du)":""}</span></div>`;
  if(!det)h+=`<div class="hint">Runde 1 &amp; 2: Schnellphase active</div>`;
  h+=`<div class="${det?"":"dz"}">`;
  
  PH.forEach((ph,i)=>{
    h+=`<div class="phase ${det&&S.p===i?"active":""} ${det&&S.p>i?"done":""}"><span class="name">${ph.n}<small>${ph.h}</small></span><button class="tg ${det&&S.p>i?"on":""}" ${(!det||!ctl||S.p!==i||(i===4&&S.cs<5))?"disabled":""} onclick="A('adv')"></button></div>`;
    if(det&&i===4&&S.p===4){
      h+=`<div class="combat">`+CS.map((s,k)=>`<div class="step ${S.cs>k?"ok":S.cs===k?"cur":""}">${S.cs>k?"✔ ":(k+1)+". "}${s}</div>`).join("");
      if(S.cs<=4&&!S.check&&ctl){
        h+=`<button class="btn" onclick="A('cstep')">${CS[S.cs]} erledigt</button>`;
        if(S.cs===1){
          h+=`<button class="btn gray" onclick="A('skip_attackers')">Keine Angreifer (Combat abbrechen)</button>`;
        }
      }
      h+=`</div>`;
    }
  });
  h+=`</div>`;
  
  if(pr){
    if(pr.ctx === "phase") {
      const activePrioSeat = pr.queue[pr.currentIdx];
      if(pr.taker != null) {
        h += me === pr.taker 
          ? `<div class="alert">Du hast die Priorität – spiele deinen Zauber / deine Antwort! (Deine Zeit läuft)</div><button class="btn big" onclick="A('done')">Fertig – alles aufgelöst</button>`
          : `<div class="hint">${names[pr.taker]} handelt gerade … (Zeit läuft für ${names[pr.taker]})</div>`;
      } else if(me === activePrioSeat) {
        h += `<div class="alert">Du bist an der Reihe! Möchtest du agieren oder passen?</div>
              <div class="center">
                <button class="btn" onclick="A('vote','take')">Priorität nehmen (Aktion)</button>
                <button class="btn gray" onclick="A('vote','pass')">Passen</button>
              </div>`;
      } else {
        h += `<div class="hint">Phasenwechsel-Check: Warte auf ${names[activePrioSeat]} …</div>`;
      }
    } else {
      const v=pr.votes||{},o=[...Array(NP).keys()].filter(i=>i!==S.active);
      if(pr.taker!=null){
        h+=me===pr.taker?`<div class="alert">Du hast die Priorität – spiele deinen Zauber / deine Antwort! (Deine Zeit läuft)</div><button class="btn big" onclick="A('done')">Fertig – alles aufgelöst</button>`
          :`<div class="hint">${names[pr.taker]} handelt gerade … (Zeit läuft für ${names[pr.taker]})</div>`;
      }else if(!act&&!v[me]){
        h+=`<div class="alert">Gegner-Priorität! Hat jemand Spontanzauber / Antworten / Trigger?</div><div class="center"><button class="btn" onclick="A('vote','take')">Priorität nehmen</button><button class="btn gray" onclick="A('vote','pass')">Passen</button></div>`;
      }else h+=`<div class="hint">Warte auf Antworten (${o.filter(i=>v[i]).length}/${o.length})</div>`;
    }
  }
  
  const inMain=det&&(S.p===3||S.p===5);
  if(!det)h+=`<div class="land"><b>Landdrop</b>Wird ab Runde 3 überwacht.</div>`;
  else if(S.lock)h+=`<div class="land lock"><b>VERPASST / STRAFE! Kein Landdrop mehr möglich</b>Gesperrt für den Rest dieses Zugs.</div>`;
  else if(S.land)h+=`<div class="land"><b>Landdrop</b>✔ Land gespielt.</div>`;
  else h+=`<div class="land"><b>Landdrop</b><button class="btn" ${(!inMain||!ctl)?"disabled":""} onclick="A('land')">Land gespielt</button><br><small style="font:12px Arial">Nur in Main 1 oder Main 2 erlaubt.</small></div>`;
  
  if(det)h+=`<button class="btn big gray" ${ctl?"":"disabled"} onclick="A('give')">Priorität abgeben</button>`;
  h+=`<button class="btn big" ${(!act||pr||S.pausedAt||(det&&S.p<7))?"disabled":""} onclick="A('end')">Zug beenden</button>`;
  if(S.pausedAt)h+=`<div class="hint">Spiel pausiert</div>`;
  $("play").innerHTML=h;tick();
}

function tick(){
  if(!S)return;
  const P=S.players,names=[];Object.values(P).forEach(p=>names[p.seat]=esc(p.name));
  const c=cur(S);let tot=c;
  const clockHolder = currentClockHolder(S);
  
  const t=names.map((n,i)=>{
    const b=(S.ptime&&S.ptime[i])||0;
    tot+=b;
    return b+(S.started&&i===clockHolder?c:0);
  });
  
  $("timer").textContent=fmt(tot);
  $("ov").innerHTML=names.map((n,i)=>`<div class="${S.started&&clockHolder===i?"act":""}">${n}<b>${fmt(t[i])}</b></div>`).join("");
}
setInterval(tick,1000);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
